name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
            artifact-path: src/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macOS-AppleSilicon
            runner: macos-15
            artifact-path: src/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: macOS-Intel
            runner: macos-15-intel
            artifact-path: src/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check release version
        shell: bash
        run: |
          bun -e '
            const pkg = await Bun.file("package.json").json();
            const tauri = await Bun.file("src-tauri/tauri.conf.json").json();
            if (pkg.version !== tauri.version) {
              throw new Error("package.json and tauri.conf.json versions must match");
            }
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${tauri.version}`) {
              throw new Error(`Tag must match application version: v${tauri.version}`);
            }
          '

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: bun run desktop:build

      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bun run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DedsiWork-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: DedsiWork-*-${{ github.ref_name }}
          path: artifacts

      - name: Prepare downloads and release notes
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GH_REPO"]
          output = Path("release-assets")
          output.mkdir()
          notes = [f"# DedsiWork {tag}", "", "## 下载安装包", ""]
          platforms = [
              ("Windows-x64", "exe", "Windows 64 位"),
              ("macOS-AppleSilicon", "dmg", "Mac Apple M 系列芯片"),
              ("macOS-Intel", "dmg", "Mac Intel 芯片"),
          ]
          for platform, extension, label in platforms:
              folder = Path("artifacts") / f"DedsiWork-{platform}-{tag}"
              files = list(folder.glob(f"*.{extension}"))
              if len(files) != 1:
                  raise RuntimeError(f"Expected one installer in {folder}, found {len(files)}")
              name = f"DedsiWork-{tag}-{platform}.{extension}"
              shutil.copy2(files[0], output / name)
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              notes.append(f"- [{label}]({url})")
          notes.extend(["", "## 安装说明", "", "Windows：运行 EXE 安装包。", "", "macOS：打开 DMG，将 DedsiWork 拖入 Applications。当前使用 ad-hoc 签名，尚未经过 Apple 公证；首次打开可能需要在系统设置 → 隐私与安全性中允许打开。", ""])
          Path("release-notes.md").write_text("\n".join(notes), encoding="utf-8")
          PY

      - name: Upload and publish release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft \
              --title "DedsiWork $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" \
            --title "DedsiWork $RELEASE_TAG" \
            --notes-file release-notes.md --draft=false
