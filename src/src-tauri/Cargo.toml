[package]
name = "dedsiwork-desktop"
version = "0.1.0"
description = "DedsiWork local workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
